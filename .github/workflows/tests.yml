name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Official v6 releases pinned to immutable commits.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          architecture: x64
      - name: Install reviewed hash-locked test/build dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build-win-py314.lock
      - name: Check installed dependency constraints
        run: python -m pip check
      - name: Run offline regressions
        run: python -m unittest discover -s tests -t . -v
