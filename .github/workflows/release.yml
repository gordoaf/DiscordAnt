name: Build Windows release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching app/appinfo.py (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          architecture: x64
      - name: Validate exact version and tag source
        run: python -c "import os; from scripts.release_metadata import app_version,validate_tag,git_info,ROOT; tag=os.environ['RELEASE_TAG']; validate_tag(tag,app_version()); git_info(ROOT,tag,require_clean=True)"
      - name: Install reviewed hash-locked build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build-win-py314.lock
      - name: Verify dependencies and regressions
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -t . -v
      - name: Install hash-verified Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'DiscordAnt-InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Inno Setup installer hash mismatch' }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $compilerDir + '"'))
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Inno Setup compiler installation failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $compilerDir 'ISCC.exe'))) { throw 'Pinned compiler is missing' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $compilerDir
      - name: Build installer and isolated bundled-browser self-test
        run: python build.py --installer
      - name: Optionally sign installer using owner's provisioned certificate
        # No certificate/key is bundled or generated. A configured thumbprint
        # requires a matching private key already provisioned on this runner.
        if: ${{ vars.WINDOWS_SIGNING_THUMBPRINT != '' }}
        env:
          SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid signing certificate thumbprint' }
          $certificate = Get-Item -LiteralPath ('Cert:\CurrentUser\My\' + $env:SIGNING_THUMBPRINT) -ErrorAction Stop
          if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
          $version = $env:RELEASE_TAG.Substring(1)
          $artifact = Join-Path $PWD ('release\DiscordAnt-Setup-' + $version + '.exe')
          $signature = Set-AuthenticodeSignature -LiteralPath $artifact -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          if ($signature.Status -ne 'Valid') { throw 'Installer signature did not validate' }
      - name: Produce installer checksum and factual provenance
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          python scripts/release_metadata.py --artifact ('release/DiscordAnt-Setup-' + $version + '.exe') --app-dir dist/DiscordAnt --tag $env:RELEASE_TAG --require-clean
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DiscordAnt-${{ env.RELEASE_TAG }}-windows
          path: |
            release/DiscordAnt-Setup-*.exe
            release/SHA256SUMS
            release/provenance.json
          if-no-files-found: error
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $artifact = 'release/DiscordAnt-Setup-' + $version + '.exe'
          gh release create $env:RELEASE_TAG $artifact release/SHA256SUMS release/provenance.json --verify-tag --title ('DiscordAnt ' + $version) --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
